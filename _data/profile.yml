intro_html: |
  <p style="font-size: 1.1em; margin-top: 0.1em">Hello! I am a PhD student in Industrial Engineering at Tel Aviv University working with <a href="https://www.eng.tau.ac.il/~talraviv/" target="_blank">Tal Raviv</a> and <a href="https://english.tau.ac.il/profile/tzurm" target="_blank">Michal Tzur</a>. I previously did my MSc at the University of California, Berkeley in Industrial Engineering and Operations Research working with <a href="https://haas.berkeley.edu/faculty/yano-candace/" target="_blank">Candace Yano</a>. During my undergrad in Engineering Science at the University of Toronto, I worked on deep learning and privacy at the <a href="https://cleverhans.io/" target="_blank">CleverHans Lab</a> with <a href="https://www.papernot.fr/" target="_blank">Nicolas Papernot</a>. My current research focuses on optimization problems for transportation, specifically line planning, timetabling and demand routing in highly connected networks. More generally, I am interested in exact optimization methods for problems spanning several stages of the network design problem.</p>
bio:
  - I am a PhD student in Industrial Engineering at Tel Aviv University working with Tal Raviv and Michal Tzur.
  - I previously completed an MSc in Industrial Engineering and Operations Research at the University of California, Berkeley and my undergrad at the University of Toronto in Engineering Science.
  - My current research focuses on optimization problems for transportation, especially line planning, timetabling, demand routing, and exact optimization methods for network design.
interests:
  - Transportation optimization
  - Line planning
  - Timetabling
  - Demand routing
  - Exact optimization methods
  - Network design
