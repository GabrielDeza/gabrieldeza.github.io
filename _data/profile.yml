bio:
  - I am a PhD student in Industrial Engineering at Tel Aviv University, advised by Tal Raviv and Michael Tzur.
  - My interests sit at the intersection of machine learning, discrete optimization, and trustworthy AI, with recent work spanning machine unlearning, graph optimization, and robotics.
  - Before starting my PhD, I completed an MSc in Industrial Engineering and Operations Research at UC Berkeley and a BASc in Engineering Science at the University of Toronto.
